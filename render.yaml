services:
  - type: web
    name: air-canvas
    runtime: python
    plan: free
    region: oregon
    branch: main
    rootDir: Air_Canvas
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FORCE_MEDIAPIPE
        value: "0"
