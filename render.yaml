services:
  - type: web
    name: air-canvas
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --timeout 120 --workers 2 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FORCE_MEDIAPIPE
        value: "1"
      - key: USE_BROWSER_CAMERA
        value: "1"
